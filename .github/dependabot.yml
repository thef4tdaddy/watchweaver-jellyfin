version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:40"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      safe-updates:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:50"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      safe-updates:
        update-types: ["minor", "patch"]
